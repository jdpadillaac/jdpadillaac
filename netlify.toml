[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#astro"

[[redirects]]
  from = "https://www.jdpadillac.com/*"
  to = "https://jdpadillac.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/es/"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

[[redirects]]
  from = "/proyectos"
  to = "/es/proyectos/"
  status = 301

[[redirects]]
  from = "/proyectos/"
  to = "/es/proyectos/"
  status = 301

[[redirects]]
  from = "/proyectos/*"
  to = "/es/proyectos/:splat"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/es/contacto/"
  status = 301

[[redirects]]
  from = "/contacto/"
  to = "/es/contacto/"
  status = 301

[[redirects]]
  from = "/sobre-mi"
  to = "/es/sobre-mi/"
  status = 301

[[redirects]]
  from = "/sobre-mi/"
  to = "/es/sobre-mi/"
  status = 301

[[redirects]]
  from = "/en/experiencia/:slug/casos/:case"
  to = "/en/experience/:slug/cases/:case"
  status = 301

[[redirects]]
  from = "/en/experiencia/:slug/"
  to = "/en/experience/:slug/"
  status = 301

[[redirects]]
  from = "/en/experiencia/"
  to = "/en/experience/"
  status = 301

[[redirects]]
  from = "/en/perfiles/:slug/"
  to = "/en/profiles/:slug/"
  status = 301

[[redirects]]
  from = "/en/perfiles/"
  to = "/en/profiles/"
  status = 301

[[redirects]]
  from = "/en/sobre-mi/"
  to = "/en/about/"
  status = 301

[[redirects]]
  from = "/en/contacto/enviado/"
  to = "/en/contact/sent/"
  status = 301

[[redirects]]
  from = "/en/contacto/"
  to = "/en/contact/"
  status = 301

[[redirects]]
  from = "/en/proyectos/:slug/"
  to = "/en/projects/:slug/"
  status = 301

[[redirects]]
  from = "/en/proyectos/"
  to = "/en/projects/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cv/jonatan-padilla-es.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "attachment; filename=\"jonatan-padilla-es.pdf\""
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/cv/jonatan-padilla-en.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "attachment; filename=\"jonatan-padilla-en.pdf\""
    Cache-Control = "public, max-age=86400"
